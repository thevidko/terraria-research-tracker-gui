name: Build

# Every push and pull request is built; pushing a tag like v1.2.3 also publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            wails_args: -tags webkit2_41
            binary: terraria-research-tracker
          - os: windows-2022
            platform: windows-amd64
            wails_args: -platform windows/amd64
            binary: terraria-research-tracker.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build helper
        run: |
          dotnet build helper/TerrariaResearchHelper.csproj -c Release -o build/helper
          mkdir -p app/helperbin
          cp build/helper/TerrariaResearchHelper.{exe,wld,cfg} app/helperbin/

      - name: Build app
        working-directory: app
        run: '"$(go env GOPATH)/bin/wails" build ${{ matrix.wails_args }}'

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="dev-${GITHUB_SHA::7}"
          name="terraria-research-tracker-${version}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp "app/build/bin/${{ matrix.binary }}" README.md README.cs.md LICENSE "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
